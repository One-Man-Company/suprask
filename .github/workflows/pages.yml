name: Publikuoti svetainę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Surinkti tik svetainės failus
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -r assets content _site/
          # katalogų indeksai neįkeliami kaip turinys — jie yra repo dokumentacija
          find _site -name "AGENTS.md" -delete

      # GitHub Pages laiko CSS/JS tarpinėje atmintyje ~10 min., todėl po
      # publikavimo žmonės dar matydavo seną vaizdą. Prie kiekvienos nuorodos
      # prirašome commit'o trumpinį — tada naršyklė ima naują failą iš karto.
      - name: Prirašyti versiją prie CSS ir JS
        run: |
          SHA="${GITHUB_SHA:0:8}"
          sed -i "s|href=\"./assets/css/main.css\"|href=\"./assets/css/main.css?v=$SHA\"|" _site/index.html
          sed -i "s|src=\"./assets/js/app.js\"|src=\"./assets/js/app.js?v=$SHA\"|" _site/index.html
          # Kabutė sugriebiama kaip atskira grupė ir grąžinama ta pati (\2),
          # todėl raštas tinka ir `from './x.js'`, ir `from "./x.js"`,
          # ir `import('./x.js')`. Anksčiau buvo ieškoma tik dvigubų kabučių,
          # todėl viengubos likdavo be žymos (LL-38: vartai nemato standarto).
          find _site/assets/js -name "*.js" -print0 | xargs -0 -r sed -i -E \
            "s#(from )(['\"])(\./[^'\"]+\.js)\2#\1\2\3?v=$SHA\2#g; s#(import\()(['\"])(\./[^'\"]+\.js)\2#\1\2\3?v=$SHA\2#g"
          # Vartai: jei bent vienas santykinis importas liko be žymos, publikavimas
          # stabdomas. Kitaip deploy būtų žalias, o vaikas iki ~10 min. matytų seną
          # JS — ir nė viena patikra to nepasakytų.
          leftover=$(grep -rnE "(from|import\()[[:space:]]*['\"\`]\./[^'\"\`]*\.js['\"\`]" _site/assets/js --include="*.js" || true)
          if [ -n "$leftover" ]; then
            echo "::error::Santykinis importas be ?v= — naršyklė ims seną failą:"
            echo "$leftover"
            exit 1
          fi
          # Vartai `index.html` KODO NUORODOMS. Du `sed` aukščiau yra kietai
          # įrašyti (`main.css`, `app.js`), o `assets/js` vartas aukščiau
          # skaito tik JS **importus**. Todėl trečia nuoroda (naujas stilius,
          # antras scenarijų failas, papildomas `<link>`) praeidavo be žymės:
          # matuota 2026-11-28 (#595) — `print.css` liko be `?v=`, žingsnis
          # praėjo rc 0. Vaikas tokiam failui iki ~10 min. gautų seną kopiją
          # iš GitHub Pages tarpinės atminties.
          #
          # Sąmoningai skaitoma **visos** `assets/css` ir `assets/js` nuorodos,
          # ne trys žinomos: kitaip tas pats defektas grįžtų su ketvirta.
          python3 - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path("_site/index.html").read_text(encoding="utf-8")
          code = re.compile(r"assets/(?:css|js)/[^?#]+\.(?:css|js)$")
          bad = []
          for m in re.finditer(r"""(?:href|src)\s*=\s*(["'])([^"']+)\1""", html):
              url = m.group(2).strip()
              path = url.split("?", 1)[0].split("#", 1)[0]
              if code.search(path) and not re.search(r"\?v=[0-9a-f]{6,40}", url):
                  bad.append(url)
          if bad:
              print(f"::error::Kodo nuoroda be ?v= ({len(bad)}): {', '.join(bad)}")
              sys.exit(1)
          print("Kodo nuorodos: visos su ?v=")
          PY
          echo "versija: $SHA"; grep -o "main.css?v=[a-f0-9]*" _site/index.html | head -1

      # Vidinės nuorodos — **surinktame artefakte**, ne repo. `check_published`
      # lygina failus, kurie yra; importas į nieką neturi su kuo lygintis, tad
      # praeitų visus vartus, o vaikui lūžtų JS grafas (baltas puslapis, LL-167).
      # Tikrinama po `?v=` injekcijos, nes būtent šį katalogą įkelia Pages:
      # jei žyma kada nors pakeistų nuorodos formą, vartas tai pamatys.
      - name: Vidaus nuorodos
        run: python3 scripts/check_refs.py --root _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
