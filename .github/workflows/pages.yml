name: Publikuoti svetainę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Surinkti tik svetainės failus
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -r assets content _site/
          # katalogų indeksai neįkeliami kaip turinys — jie yra repo dokumentacija
          find _site -name "AGENTS.md" -delete

      # GitHub Pages laiko CSS/JS tarpinėje atmintyje ~10 min., todėl po
      # publikavimo žmonės dar matydavo seną vaizdą. Prie kiekvienos nuorodos
      # prirašome commit'o trumpinį — tada naršyklė ima naują failą iš karto.
      - name: Prirašyti versiją prie CSS ir JS
        run: |
          SHA="${GITHUB_SHA:0:8}"
          sed -i "s|href=\"./assets/css/main.css\"|href=\"./assets/css/main.css?v=$SHA\"|" _site/index.html
          sed -i "s|src=\"./assets/js/app.js\"|src=\"./assets/js/app.js?v=$SHA\"|" _site/index.html
          find _site/assets/js -name "*.js" -print0 | xargs -0 sed -i -E \
            "s|(from \"\./[^\"]+\.js)\"|\1?v=$SHA\"|g; s|(import\(\"\./[^\"]+\.js)\"\)|\1?v=$SHA\")|g"
          echo "versija: $SHA"; grep -o "main.css?v=[a-f0-9]*" _site/index.html | head -1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
