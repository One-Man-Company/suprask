name: Publikuoti svetainę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Surinkti tik svetainės failus
        run: |
          mkdir -p _site
          # **Visi** šaknies HTML puslapiai, ne du vardai ranka. Iki #609 čia
          # stovėjo `cp index.html 404.html _site/`: trečias puslapis
          # (`apie.html`, `spausdinti.html`) būtų likęs repo ir nebūtų
          # patekęs į svetainę — be jokio varto, kuris tai pasakytų
          # (LL-242). `check_published.py` skaito tą patį sąrašą iš disko
          # (`root_pages()`), tad surinkimas ir matavimas negali išsiskirti.
          # Slapti failai (`.probe-*.html`) neįkeliami: jie yra zondų
          # artefaktai, o ne puslapiai.
          find . -maxdepth 1 -name "*.html" -not -name ".*" -exec cp {} _site/ \;
          cp -r assets content _site/
          # katalogų indeksai neįkeliami kaip turinys — jie yra repo dokumentacija
          find _site -name "AGENTS.md" -delete

      # GitHub Pages laiko CSS/JS tarpinėje atmintyje ~10 min., todėl po
      # publikavimo žmonės dar matydavo seną vaizdą. Prie kiekvienos nuorodos
      # prirašome commit'o trumpinį — tada naršyklė ima naują failą iš karto.
      - name: Prirašyti versiją prie CSS ir JS
        run: |
          SHA="${GITHUB_SHA:0:8}"
          sed -i "s|href=\"./assets/css/main.css\"|href=\"./assets/css/main.css?v=$SHA\"|" _site/index.html
          sed -i "s|src=\"./assets/js/app.js\"|src=\"./assets/js/app.js?v=$SHA\"|" _site/index.html
          # Kabutė sugriebiama kaip atskira grupė ir grąžinama ta pati (\2),
          # todėl raštas tinka ir `from './x.js'`, ir `from "./x.js"`,
          # ir `import('./x.js')`. Anksčiau buvo ieškoma tik dvigubų kabučių,
          # todėl viengubos likdavo be žymos (LL-38: vartai nemato standarto).
          find _site/assets/js -name "*.js" -print0 | xargs -0 -r sed -i -E \
            "s#(from )(['\"])(\./[^'\"]+\.js)\2#\1\2\3?v=$SHA\2#g; s#(import\()(['\"])(\./[^'\"]+\.js)\2#\1\2\3?v=$SHA\2#g"
          # Kodo nuorodos, sudarytos SCENARIJUMI, o ne atributu. `404.html`
          # rašo `css.href = root + "assets/css/main.css"` — dviejų kietai
          # įrašytų `sed` raštų aukščiau jiems nepakliūna, `assets/js` vartas
          # skaito tik JS katalogą, o `check_published.py` iki #607 skaitė tik
          # `index.html`. Pasekmė tokia pat kaip LL-233: adresas atsako 200,
          # bet `cache-control: max-age=600` (matuota gyvai), tad iki 10 min.
          # naršyklė ima seną `main.css` — būtent tai, ko ši žymė saugo.
          # Todėl žymė dedama į patį literalą, prieš kabutę; raštas tinka ir
          # atributams, tad antras kartas žymės nebesudvigubina.
          find _site -maxdepth 1 -name "*.html" -print0 | xargs -0 -r sed -i -E \
            "s#(['\"])((\./)?assets/(css|js)/[^'\"?#[:space:]]+\.(css|js))\1#\1\2?v=$SHA\1#g"
          # Vartai: jei bent vienas santykinis importas liko be žymos, publikavimas
          # stabdomas. Kitaip deploy būtų žalias, o vaikas iki ~10 min. matytų seną
          # JS — ir nė viena patikra to nepasakytų.
          leftover=$(grep -rnE "(from|import\()[[:space:]]*['\"\`]\./[^'\"\`]*\.js['\"\`]" _site/assets/js --include="*.js" || true)
          if [ -n "$leftover" ]; then
            echo "::error::Santykinis importas be ?v= — naršyklė ims seną failą:"
            echo "$leftover"
            exit 1
          fi
          # Vartai `index.html` KODO NUORODOMS. Du `sed` aukščiau yra kietai
          # įrašyti (`main.css`, `app.js`), o `assets/js` vartas aukščiau
          # skaito tik JS **importus**. Todėl trečia nuoroda (naujas stilius,
          # antras scenarijų failas, papildomas `<link>`) praeidavo be žymės:
          # matuota 2026-11-28 (#595) — `print.css` liko be `?v=`, žingsnis
          # praėjo rc 0. Vaikas tokiam failui iki ~10 min. gautų seną kopiją
          # iš GitHub Pages tarpinės atminties.
          #
          # Sąmoningai skaitoma **visos** `assets/css` ir `assets/js` nuorodos,
          # ne trys žinomos: kitaip tas pats defektas grįžtų su ketvirta.
          #
          # Nuo #607 skaitomi **visi šaknyje atiduodami HTML puslapiai**, ne
          # vien `index.html`, ir abi nuorodų formos: atributas
          # (`href="./assets/css/main.css"`) IR literalas scenarijuje
          # (`root + "assets/css/main.css"`, `404.html`). Matuota: iki šio
          # pataisymo šis žingsnis davė „Kodo nuorodos: visos su ?v=“ rc 0,
          # nors `404.html` CSS nuorodos neturėjo nė vieno žymės ženklo, o
          # `check_published.py` vardiklis „2/2“ skaičiavo tik `index.html`.
          python3 - <<'PY'
          import re, pathlib, sys
          code = re.compile(r"assets/(?:css|js)/[^?#\s]+\.(?:css|js)$")
          attr = re.compile(r"""(?:href|src)\s*=\s*(["'])([^"']+)\1""")
          lit = re.compile(
              r"""(["'])((?:\./)?assets/(?:css|js)/[^"'?#\s]+\.(?:css|js))"""
              r"""((?:\?v=[0-9a-f]{6,40})?)\1""")
          bad, pages = [], []
          for page in sorted(pathlib.Path("_site").glob("*.html")):
              html = page.read_text(encoding="utf-8")
              pages.append(page.name)
              for m in attr.finditer(html):
                  url = m.group(2).strip()
                  path = url.split("?", 1)[0].split("#", 1)[0]
                  if code.search(path) and not re.search(r"\?v=[0-9a-f]{6,40}", url):
                      bad.append(f"{page.name}: {url}")
              for m in lit.finditer(html):
                  if not m.group(3):
                      bad.append(f"{page.name}: {m.group(2)} (scenarijuje)")
          if bad:
              print(f"::error::Kodo nuoroda be ?v= ({len(bad)}): {', '.join(bad)}")
              sys.exit(1)
          print(f"Kodo nuorodos: visos su ?v= ({len(pages)} puslapiai: {', '.join(pages)})")
          PY
          echo "versija: $SHA"; grep -o "main.css?v=[a-f0-9]*" _site/index.html | head -1

      # Vidinės nuorodos — **surinktame artefakte**, ne repo. `check_published`
      # lygina failus, kurie yra; importas į nieką neturi su kuo lygintis, tad
      # praeitų visus vartus, o vaikui lūžtų JS grafas (baltas puslapis, LL-167).
      # Tikrinama po `?v=` injekcijos, nes būtent šį katalogą įkelia Pages:
      # jei žyma kada nors pakeistų nuorodos formą, vartas tai pamatys.
      - name: Vidaus nuorodos
        run: python3 scripts/check_refs.py --root _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
