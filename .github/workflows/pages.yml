name: Publikuoti svetainę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Surinkti tik svetainės failus
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -r assets content _site/
          # katalogų indeksai neįkeliami kaip turinys — jie yra repo dokumentacija
          find _site -name "AGENTS.md" -delete

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
