name: Tikrinti turinį

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Turinio validacija
        run: python3 scripts/validate_content.py

      # index.json ↔ moduliai ↔ path.json ↔ SIMS sutapimas ir našlaičiai
      # failai. `validate_content.py` jų nelygina: be šio žingsnio našlaitis
      # modulio failas (įrašytas, bet neįtrauktas į index.json) praeidavo
      # visus PR vartus ir atsidurdavo svetainėje (#30960).
      - name: Registrų sankirta
        run: python3 scripts/check_registry.py

      # Maršruto tvarka. `check_registry.py` lygina `path.json` **aibę** su
      # indeksu, bet ne senų ID santykinę tvarką: perstatymas praeidavo visus
      # vartus, nors vaiko „Tęsk nuo čia“ žingsnis persikeldavo (gairės T3.6).
      # #481 atvejis (`07-elektronika` iš 70 į 48) buvo rastas tik tada, kai
      # jau buvo svetainėje, ir beliko konstatuoti. Režimas yra be tinklo ir be
      # `git show`: lygina su užfiksuota `scripts/known_path_order.json` seka,
      # tad sąmoningas perstatymas lieka galimas, bet matomas `git diff`.
      - name: Maršruto tvarka
        run: python3 scripts/check_published.py --path-order

      # Vidinės nuorodos. `check_published.py` lygina **failus, kurie repo
      # yra**; importas į failą, kurio niekas nesukūrė (ar su rašybos klaida),
      # nelyginamas su niekuo, tad deploy žalias, o vaikui lūžta visas JS
      # grafas — baltas puslapis. Tas pats galioja CSS `url(...)` ir `404.html`
      # nuorodoms. Patikra yra be tinklo: tik repo failų egzistavimas.
      - name: Vidaus nuorodos
        run: python3 scripts/check_refs.py

      - name: Dokumentų skaičiai
        run: python3 scripts/check_docs_facts.py

      # Programos padengties eilė yra agentų darbo sąrašas. Jei
      # `curriculum/*.md` pasikeitė, o `backlog.json` nepergeneruotas, agentai
      # dirbtų pagal pasenusį sąrašą — todėl tai vartai, ne rekomendacija.
      - name: Programos padengties eilė
        run: python3 scripts/curriculum_backlog.py --check

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Agentų sistema
        run: python3 scripts/check_agents.py

      - name: Iliustracijų standartas
        run: python3 scripts/check_art.py

      - name: Pamokų registras
        run: python3 scripts/check_lessons.py

      - name: Užduočių formuluotės
        run: python3 scripts/check_language.py --grade 1 --strict

      - name: Garso pilnumas
        run: python3 scripts/check_audio.py

      - name: Simuliacijų registras
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          ids = set()
          for f in pathlib.Path("assets/js/sims").glob("*.js"):
              text = f.read_text(encoding="utf-8")
              block = re.search(r"export const SIMS\s*=\s*\{(.*?)\n\};", text, re.S)
              if not block:
                  continue
              for m in re.finditer(r'^\s*(?:"([a-z0-9-]+)"|([a-z0-9-]+))\s*[:,]', block.group(1), re.M):
                  ids.add(m.group(1) or m.group(2))
          if len(ids) < 5:
              sys.exit("Per mažai registruotų simuliacijų: %s" % sorted(ids))
          print("Simuliacijos:", ", ".join(sorted(ids)))
          PY

      - name: Nėra išorinių resursų
        run: |
          if grep -RIn --include="*.html" --include="*.js" --include="*.css" \
              -E "https?://(cdn|unpkg|jsdelivr|fonts\.googleapis|ajax\.googleapis)" . ; then
            echo "Rastas išorinis CDN resursas — draudžiama."; exit 1
          fi
          echo "Švaru."
